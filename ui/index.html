<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- the app's own folder as the base for every relative file: a career's address is several folders deep
         (dynasty/app-st/recruiting), and without this ./favicon.svg and the built ./assets would be looked for there -->
    <script>
      document.write(
        '<base href="' +
          location.pathname
            .replace(/(dynasty\/.*|play|coach\/edit|program\/edit|player\/edit)\/?$/, "")
            .replace(/[^/]*$/, "") +
          '" />',
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pocket College Football</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <!-- the saved theme (the same key as the old UI), set before the first paint -->
    <script>
      try {
        var t = localStorage.getItem("cfp.theme");
        if (t !== "light" && t !== "dark" && t !== "school") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
