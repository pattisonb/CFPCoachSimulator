# Build the browser site (dist/) and publish it to GitHub Pages. Pages serves the clear-mode branch (main is the
# Vercel site): a push to clear-mode starts this workflow by name (.github/workflows/pages-clear-mode.yml on that
# branch), and it runs from main so the github-pages environment allows the deploy.
# One-time setting: the repository's Settings -> Pages -> Source: GitHub Actions.
#
# Run workflow with a branch name builds that branch instead, and the repository variable PAGES_BRANCH
# (Settings -> Secrets and variables -> Actions -> Variables) changes the default from clear-mode. The page says which
# branch and commit it is (dist/preview.json).
name: Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (empty: PAGES_BRANCH if set, else clear-mode)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pick the branch
        id: pick
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          PINNED: ${{ vars.PAGES_BRANCH }}
        run: |
          ref="${INPUT_BRANCH:-${PINNED:-clear-mode}}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building branch $ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # no pip install step: the build and the game use only the standard library
      - name: Build the team data
        run: python -m teamdata.build_teams
      - name: Build the site
        run: python tools/build_site.py
      - name: Stamp the preview
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          printf '{"branch": "%s", "commit": "%s", "built": "%s"}\n' "$REF" "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%MZ)" > dist/preview.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
