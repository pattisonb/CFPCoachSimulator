<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The browser tests' fonts, the same on every machine: the generic families (and Inter, which some
     machines map them to) resolve to DejaVu Sans, a wide font. A layout that only fits a narrow font
     (a label measured by guess, a tag that cannot wrap) fails here as it would for a player whose
     computer has wider fonts. tests/test_career_e2e.launch points Chromium at this file. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Inter</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
