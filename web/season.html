<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Season · CFP Coach Simulator</title>
  <meta name="theme-color" content="#131a2e" />
  <meta name="description" content="Simulate any college football game or a full season with real 2026 schedules, rosters, polls, the playoff and bowls, or follow the real 2026 season with live stats." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CFP Coach Simulator" />
  <meta property="og:title" content="Season · CFP Coach Simulator" />
  <meta property="og:description" content="Simulate any college football game or a full season with real 2026 schedules, rosters, polls, the playoff and bowls, or follow the real 2026 season with live stats." />
  <meta property="og:url" content="https://cfp-coach-simulator.onrender.com/season" />
  <meta property="og:image" content="https://cfp-coach-simulator.onrender.com/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="/manifest.json" />
  <script>try{var t=localStorage.getItem("cfp.theme");if(!t&&window.matchMedia("(prefers-color-scheme: light)").matches)t="light";if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="brand-link" href="/" aria-label="CFP Coach Simulator home">
        <img class="brand-icon" src="/favicon.svg" alt="" width="28" height="28" />
        <span class="brand-name">CFP Coach Simulator</span>
      </a>
    </div>
    <nav class="site-nav" aria-label="Sections">
      <a href="/" data-nav="game">Sim a game</a>
      <a href="/season" data-nav="season">Sim a season</a>
      <a href="/real" data-nav="real">Real 2026</a>
    </nav>

    <div class="toolbar" id="season-toolbar">
      <select id="pick-team" aria-label="Your team"></select>
      <button id="btn-new" class="accent" type="button" title="Play the whole 2026 season from week 1">New season</button>
      <button id="btn-today" class="ghost" type="button" title="Start from today: the real results, polls and stats so far, then play the rest">Start from today</button>
      <button id="btn-seasons" class="ghost" type="button" aria-pressed="false" title="Show or hide the saved seasons">Seasons</button>
      <button class="ghost btn-theme" type="button" aria-label="Toggle light or dark mode"></button>
    </div>
  </header>

  <main class="season-layout">
    <aside class="season-side" id="season-side">
      <div class="section-head"><h2>Seasons</h2><span class="side-actions"><button id="btn-clear-seasons" class="ghost small" type="button">Clear all</button><button id="btn-hide-seasons" class="ghost small" type="button" title="Hide this list">Hide ‹</button></span></div>
      <ul id="season-list" class="history-list"></ul>
    </aside>

    <section class="season-main">
      <div id="season-empty" class="empty">
        <p>Pick your team and a mode, then start a season. You can play it a week at a time, or sim ahead to selection day or the title game.</p>
      </div>

      <div id="season" hidden>
        <div class="panel season-head">
          <div class="season-head-row">
            <div>
              <div id="season-title"></div>
              <div id="season-meta" class="muted"></div>
            </div>
            <div class="season-actions">
              <button id="btn-gameday" class="primary" type="button" title="Play your game this week, drive by drive; Advance then plays the rest of the week">Game day</button>
              <button id="btn-advance" class="ghost" type="button">Advance to Next Week</button>
              <button id="btn-to-selection" class="ghost" type="button">Sim to selection</button>
              <button id="btn-to-end" class="ghost" type="button">Sim to the end</button>
              <button id="btn-settings" class="ghost" type="button" title="Season settings: god mode and more">⚙ Settings</button>
              <button id="btn-real-refresh" class="ghost" type="button" hidden title="Download the latest real results, box scores and polls">Refresh real data</button>
            </div>
          </div>
          <div id="season-progress" class="progress" hidden><div id="season-progress-bar" class="progress-bar"></div></div>
          <div id="season-progress-text" class="progress-text muted" hidden></div>
          <div id="week-strip" class="week-strip"></div>
          <div id="week-date" class="week-date muted"></div>
        </div>

        <nav class="tabs" id="season-tabs">
          <button data-tab="schedule" class="active" type="button">Team Schedule</button>
          <button data-tab="depth" type="button">Depth Chart</button>
          <button data-tab="summary" type="button" hidden>Summary</button>
          <button data-tab="games" type="button" hidden>Games</button>
          <button data-tab="standings" type="button">Standings</button>
          <button data-tab="rankings" type="button">Rankings</button>
          <button data-tab="bracket" type="button">Bracket</button>
          <button data-tab="bowls" type="button">Bowls</button>
          <button data-tab="awards" type="button">Awards</button>
          <button data-tab="stats" type="button">Stats</button>

        </nav>

        <div class="panel" id="sim-overlay" hidden>
          <div class="sim-head">
            <div>
              <div class="review-label">Simming</div>
              <div id="sim-stage" class="sim-stage"></div>
              <div id="sim-sub" class="muted small-text"></div>
            </div>
            <button id="btn-pause" class="ghost" type="button">Pause after this week</button>
          </div>
          <div class="progress"><div id="sim-bar" class="progress-bar"></div></div>
          <div id="sim-results" class="sim-results"></div>
        </div>
        <div class="panel tab-body" id="tab-games"></div>
        <div class="panel tab-body" id="tab-schedule" hidden></div>
        <div class="panel tab-body" id="tab-standings" hidden></div>
        <div class="panel tab-body" id="tab-rankings" hidden>
          <div class="view-chips" id="poll-pills">
            <button class="chip active" data-poll="ap" type="button">AP Poll</button>
            <button class="chip" data-poll="coaches" type="button">Coaches Poll</button>
            <button class="chip" data-poll="cfp" type="button">CFP Rankings</button>
            <button class="chip" data-poll="resume" type="button" title="Record, ranked wins, strength of schedule, best win and worst loss">Resume</button>
          </div>
          <div id="poll-body"></div>
        </div>
        <div class="panel tab-body" id="tab-bracket" hidden></div>
        <div class="panel tab-body" id="tab-bowls" hidden></div>
        <div class="panel tab-body" id="tab-summary" hidden></div>
        <div class="panel tab-body" id="tab-awards" hidden></div>
        <div class="panel tab-body" id="tab-stats" hidden>
          <div class="view-chips stats-chips" id="stats-chips"></div>
          <div id="tab-teamstats" hidden></div>
          <div id="tab-playerstats" hidden></div>
        </div>
        <div class="panel tab-body" id="tab-depth" hidden></div>
        <div id="tab-box" hidden>
          <div class="scoreboard panel">
            <div class="score-row" id="sbox-score-row"></div>
            <table class="quarters" id="sbox-quarters"></table>
            <div class="score-meta muted" id="sbox-meta"></div>
          </div>
          <nav class="tabs" id="sbox-tabs">
            <button data-btab="scoring" class="active" type="button">Scoring</button>
            <button data-btab="team" type="button">Team Stats</button>
            <button data-btab="home" type="button">Home Players</button>
            <button data-btab="away" type="button">Away Players</button>
            <button data-btab="drives" type="button">Drives</button>
          </nav>
          <div class="panel tab-body" id="sbox-scoring"></div>
          <div class="panel tab-body" id="sbox-team" hidden></div>
          <div class="panel tab-body" id="sbox-home" hidden></div>
          <div class="panel tab-body" id="sbox-away" hidden></div>
          <div class="panel tab-body" id="sbox-drives" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div id="modal-title" class="modal-title"></div>
        <button class="ghost modal-close" id="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/gameview.js"></script>
  <script src="/season.js"></script>
</body>
</html>
